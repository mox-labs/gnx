[project]
name = "gnx"
version = "0.1.0"
description = "gnx — the catalog: component registry, Claude Code marketplace, and agentic CLI for composable cognitive extensions."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13",
    "pyyaml>=6",
]

[project.scripts]
gnx = "gnx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnx"]

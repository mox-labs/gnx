name: pages

# Deploys the PUBLIC register only (D22: one tree, two builds). GNX_PUBLIC_BUILD=1 swaps in
# adapter-static and the prerenderer walks the `(public)` group; the `(dossier)` group is a
# dynamic surface with a POST feedback endpoint and is deliberately not published.
#
# The catalog page reads components/ and .claude-plugin/marketplace.json from the repo at
# build time, so the checkout must be the whole repo, not just docs/.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only what deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push win rather than queueing stale builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/configure-pages@v5
        id: pages
      - name: install docsite deps
        run: cd docs/experience && bun install --frozen-lockfile
      - name: build the public register
        env:
          GNX_PUBLIC_BUILD: '1'
          # configure-pages reports the served base path, so a custom domain (base '')
          # and a project page (base '/gnx') both work without editing this file.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: cd docs/experience && bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/experience/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

name: pages

# Deploys the PUBLIC register only (D22: one tree, two builds). GNX_PUBLIC_BUILD=1 swaps in
# adapter-static and the prerenderer walks the `(public)` group; the `(dossier)` group is a
# dynamic surface with a POST feedback endpoint and is deliberately not published.
#
# The catalog page reads components/ and .claude-plugin/marketplace.json from the repo at
# build time, so the checkout must be the whole repo, not just docs/.
#
# bun installs from a pinned release URL with a SHA256 check rather than via
# oven-sh/setup-bun: this repo's Actions policy allows only `actions/*` and requires full
# SHA pins. See ci.yml for the same block and the note about lifting it into a shared
# `mox-labs/ci/setup` composite action.

# A push to main deploys only once `ci` has passed on that commit, and what deploys is that
# commit, not whatever main points at by then. A manual run deploys main as it stands.
#
# workflow_run is the trigger zizmor warns of: it runs with this repository's permissions for a
# run that a fork's pull request can start, and the harm comes from building that pull request's
# code. Here the build job runs only for a `ci` run on a push (`event == 'push'` below), which no
# fork can make, and checks out that push's commit on main.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- only ci runs on a push to main deploy

    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least privilege, per job: the build, which runs bun install and the build's own code, can read
# the repository and the Pages settings and nothing else; only deploy can write to Pages or mint
# the OIDC token deploy-pages presents.
permissions: {}

# One deploy at a time. A newer run replaces one still waiting, so stale builds do not queue,
# and a deploy already under way finishes rather than being cut off mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"
  BUN_SHA256: "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # the checkout
      pages: read # configure-pages reads the site's settings, its base path among them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - name: bun (pinned + checksummed)
        # The path written to GITHUB_PATH is this step's own constant, never input.
        run: | # zizmor: ignore[github-env]
          set -euo pipefail
          BIN="$HOME/.gnx-tools"
          mkdir -p "$BIN"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            -o bun.zip "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "$BUN_SHA256  bun.zip" | sha256sum -c -
          unzip -qo bun.zip
          mv bun-linux-x64/bun "$BIN/" && chmod +x "$BIN/bun"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: install docsite deps
        run: cd docs/experience && bun install --frozen-lockfile

      - name: build the public register
        env:
          GNX_PUBLIC_BUILD: '1'
          # configure-pages reports the served base path, so a custom domain (base '')
          # and a project page (base '/gnx') both work without editing this file.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: cd docs/experience && bun run build

      # v5, not v3. The policy is enforced on NESTED actions too — v3's action.yml calls
      # `actions/upload-artifact@v4` by tag, and sha_pinning_required rejected the run at
      # job setup for a reference this file never made. v5 pins its own internals
      # (upload-artifact@bbbca2dd, v7.0.0). This is the SHA vaani uses under the same policy.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/experience/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact the build uploaded
      id-token: write # the OIDC token deploy-pages presents to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

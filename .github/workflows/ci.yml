name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# This repo's Actions policy is `allowed_actions: selected` with `sha_pinning_required`,
# and the allowlist is vaani's — actions/*, dtolnay/rust-toolchain, the cargo-* family.
# gnx needs just, uv, bun, gitleaks, osv-scanner, zizmor and k6, none of which are on it. Every `uses:` must
# therefore resolve to `actions/*`, pinned to a full commit SHA.
#
# So the toolchain installs from pinned release URLs with SHA256 verification instead.
# That is a stronger position than an action reference, not a weaker one: the version and
# the bytes are both fixed here, in a reviewed file, rather than behind a tag that can move.
#
# These blocks are the intended body of a shared `mox-labs/ci/setup` composite action. When
# that exists, this becomes one `uses:` and the pins live in one repo instead of in each.
# Keep them in a shape that lifts cleanly.
#
# The gates themselves are the justfile's: the gate job installs the tools and runs
# `just ci`, the recipe the pre-commit hook's `just check` is part of, so the two cannot
# drift.

permissions:
  contents: read

env:
  JUST_VERSION: "1.58.0"
  JUST_SHA256: "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d"
  UV_VERSION: "0.12.5"
  UV_SHA256: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
  BUN_VERSION: "1.3.14"
  BUN_SHA256: "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # `just audit`. The checksum is the one the release's osv-scanner_SHA256SUMS gives.
  OSV_SCANNER_VERSION: "2.7.0"
  OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
  # `just workflows-lint`. zizmor publishes no checksum file: this is the release asset's
  # digest as GitHub reports it, and the asset's build-provenance attestation matches it
  # (`gh attestation verify <file> --repo zizmorcore/zizmor`).
  ZIZMOR_VERSION: "1.31.1"
  ZIZMOR_SHA256: "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99"
  # ix's end-to-end CLI tests drive a real k6 against a real subject.
  K6_VERSION: "1.8.1"
  K6_SHA256: "b02cd649a0e391576909502e9b7760d3fb9e1fd14d179e3da18ee4a185f4c583"
  # ix's live compose test starts this image and pulls nothing itself. Pinned by its index
  # digest, then tagged with the name the test uses.
  COMPOSE_TEST_IMAGE: "alpine:3.20"
  COMPOSE_TEST_DIGEST: "sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc"

jobs:
  gate:
    runs-on: ubuntu-latest
    # A run takes minutes; a hang ends here, not at GitHub's six-hour limit. Each test is also
    # bounded on its own (pytest-timeout).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Nothing here pushes, so the token is not left in .git/config for the steps after.
          persist-credentials: false

      # Cached on the pinned versions, so a bump is a cache miss by construction and a
      # tampered cache entry cannot survive the checksum step below.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: toolcache
        with:
          path: ~/.gnx-tools
          key: gnx-tools-${{ runner.os }}-just${{ env.JUST_VERSION }}-uv${{ env.UV_VERSION }}-bun${{ env.BUN_VERSION }}-gitleaks${{ env.GITLEAKS_VERSION }}-osv${{ env.OSV_SCANNER_VERSION }}-zizmor${{ env.ZIZMOR_VERSION }}-k6${{ env.K6_VERSION }}

      - name: toolchain (just, uv, bun, gitleaks, osv-scanner, zizmor, k6 — pinned + checksummed)
        run: |
          set -euo pipefail
          BIN="$HOME/.gnx-tools"
          mkdir -p "$BIN" "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"

          # Verify BEFORE unpacking: a checksum checked after extraction has already let
          # the archive touch the filesystem.
          fetch() { # url  expected-sha256  filename
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }

          if [ ! -x "$BIN/just" ]; then
            fetch "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
                  "$JUST_SHA256" just.tar.gz
            tar -xzf just.tar.gz just && mv just "$BIN/"
          fi

          if [ ! -x "$BIN/uv" ]; then
            fetch "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
                  "$UV_SHA256" uv.tar.gz
            tar -xzf uv.tar.gz --strip-components=1 -C "$BIN" uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx
          fi

          if [ ! -x "$BIN/bun" ]; then
            fetch "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip" \
                  "$BUN_SHA256" bun.zip
            unzip -qo bun.zip && mv bun-linux-x64/bun "$BIN/"
          fi

          if [ ! -x "$BIN/gitleaks" ]; then
            fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
                  "$GITLEAKS_SHA256" gitleaks.tar.gz
            tar -xzf gitleaks.tar.gz gitleaks && mv gitleaks "$BIN/"
          fi

          if [ ! -x "$BIN/osv-scanner" ]; then
            fetch "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
                  "$OSV_SCANNER_SHA256" osv-scanner
            mv osv-scanner "$BIN/"
          fi

          if [ ! -x "$BIN/zizmor" ]; then
            fetch "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
                  "$ZIZMOR_SHA256" zizmor.tar.gz
            tar -xzf zizmor.tar.gz zizmor && mv zizmor "$BIN/"
          fi

          if [ ! -x "$BIN/k6" ]; then
            fetch "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" \
                  "$K6_SHA256" k6.tar.gz
            tar -xzf k6.tar.gz --strip-components=1 "k6-v${K6_VERSION}-linux-amd64/k6" && mv k6 "$BIN/"
          fi

          chmod +x "$BIN"/*
          echo "$BIN" >> "$GITHUB_PATH"

      - name: versions
        run: |
          just --version && uv --version && bun --version && gitleaks version
          osv-scanner --version && zizmor --version && k6 version

      # The runner's docker, with its compose plugin, for ix's live compose test.
      - name: docker compose and the compose test's image
        run: |
          set -euo pipefail
          docker compose version
          docker pull "alpine@${COMPOSE_TEST_DIGEST}"
          docker tag "alpine@${COMPOSE_TEST_DIGEST}" "$COMPOSE_TEST_IMAGE"

      - name: install docsite deps
        run: cd docs/experience && bun install --frozen-lockfile

      # docs-sync's CHANGELOG check reads the commits since the merge-base with the branch this
      # merges into; the checkout's fetch-depth: 0 is what gives it that history.
      - name: just ci
        env:
          DOCS_SYNC_BASE: origin/${{ github.base_ref || 'main' }}
        run: just ci

  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: validate conventional commits
        # Through the environment, never `${{ }}` in the script: a branch name is text the
        # shell would otherwise run.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          base="origin/$BASE_REF"
          git rev-parse "$base" >/dev/null 2>&1 || { echo "no base $base; skipping"; exit 0; }
          fail=0
          for sha in $(git rev-list "$base"..HEAD); do
            msg=$(git log -1 --format=%s "$sha")
            case "$msg" in
              Merge*) ;;
              *) echo "$msg" | grep -qE '^(feat|fix|docs|refactor|test|chore|perf|ci|build|style|revert)(\(.+\))?!?: .+' \
                   || { echo "❌ $sha: $msg"; fail=1; } ;;
            esac
          done
          exit $fail

# Version updates: Dependabot proposes newer versions, a week at a time, one pull request per
# ecosystem. Each goes through ci like any other change, `just audit` included.
#
# Security updates (a pull request for each Dependabot alert, outside this schedule) are a
# repository setting, not this file: Settings, Code security, Dependabot security updates.
#
# A release must be a week old before it is proposed (cooldown), so one published by a hijacked
# account has time to be found and pulled first. Security updates do not wait.

version: 2

updates:
  # The capability packages' uv workspace: every package, one lock.
  - package-ecosystem: uv
    directory: /components/capabilities
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # A dependency joins the first group that matches it. Pydantic AI's packages are what matrix's
    # pydantic-ai runtime and ix's evaluator sensor are built on, and their releases change what
    # an agent sends a model and which evaluators exist. They get a pull request of their own, so
    # an update that needs code changes there does not hold back every other update.
    groups:
      pydantic-ai:
        patterns: ["pydantic-ai*", "pydantic-evals", "pydantic-graph"]
      python:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # The docsite (docs/experience).
  - package-ecosystem: bun
    directory: /docs/experience
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # TypeScript 7 does not provide the JavaScript compiler API that SvelteKit loads its config
    # with (kit error `typescript_compiler_api_missing`), so the site cannot build on it. Remove
    # this when SvelteKit supports TypeScript 7.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      docsite:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Every `uses:` in .github/workflows. Dependabot keeps the full-SHA pins and their `# vN`
  # comments in step. The toolchain pins in the workflows' env blocks are URLs and checksums,
  # which it does not read: those are bumped by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

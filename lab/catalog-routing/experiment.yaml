# Does the right catalog component fire for a real ask, and stay quiet for a decoy?
#
# The catalog's promise is that a description routes correctly; this states that promise as
# a measurement instead of an assertion.
#
#   ix validate lab/catalog-routing
#   ix plan lab/catalog-routing
#
# Order and the estimator are the evaluate genre's; the plan shows them. Repeats are set
# below: routing is stochastic, and one pass has no error bar.
name: catalog-routing
question: Does the right catalog component fire for a real ask, and stay quiet for a decoy?
rationale: >-
  A skill's description is all the model has to route on. If the descriptions are right,
  must_trigger asks activate the named skill and decoys pitched near its vocabulary do not.
genre: evaluate

subjects:
  catalog:
    kind: agent-session
    description: The gnx marketplace as shipped, loaded into a real agent session.
    runtime: claude-sdk
    # One turn: the Skill call happens in the first assistant turn, and stopping there
    # measures routing rather than paying for the whole task.
    max_turns: 1
    # Hermetic: no ambient ~/.claude plugins leak in, so what is measured is this repo's
    # projected catalog and nothing else.
    setting_sources: []
    # Unattended: no human is present to confirm a tool call.
    permission_mode: bypassPermissions
    # The catalog as projected today: three plugins.
    #
    # KNOWN GAP (2026-09-24): five of the eight probes expect skills that left the catalog
    # on 2026-08-19 (aces, trust-boundaries, dao; now in incubator/). Those probes fail by
    # construction until the skills graduate or the probes change.
    plugins:
      - {type: local, path: ../../plugins/intent-hardening}
      - {type: local, path: ../../plugins/rational-inquiry}
      - {type: local, path: ../../plugins/recon}

# The probes are the .md files in probes/: the body is the prompt; `expectation` and
# `expected_skill` in the frontmatter are the truth the activation sensor measures against.

primary: {metric: activated_correctly}
threshold: {op: ">=", value: 0.9}

# 8 probes x 5 repeats = 40 sessions: the genre's minimum, and more than the 35 a pass
# rate's interval needs to reach above 0.9 at all (the genre's default of 10 would cost
# about 8 USD). The per-trial figure is an estimate; the ceiling is what stops a run that
# goes wrong.
repeats: 5
spend: {ceiling: 5.00, per_trial: 0.10}

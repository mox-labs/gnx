<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 860 380"
  role="img"
  aria-label="Authoring-time projection flow: components source through gnx build to generated plugin directories and marketplace manifest, then to user install cache"
>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#e05d44"/>
    </marker>
  </defs>

  <!-- ─── COLUMN 1: components/ source ─── -->
  <!-- outer grouping box -->
  <rect x="20" y="48" width="168" height="222" rx="5"
        fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="104" y="38" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" letter-spacing=".04em">
    components/
  </text>

  <!-- manifest box -->
  <rect x="36" y="64" width="136" height="40" rx="4"
        fill="rgba(107,114,128,.07)" stroke="#9ca3af" stroke-width="1"/>
  <text x="104" y="82" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">manifest</text>
  <text x="104" y="97" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">kind · apiVersion · provides</text>

  <!-- skill box -->
  <rect x="36" y="122" width="136" height="40" rx="4"
        fill="rgba(107,114,128,.07)" stroke="#9ca3af" stroke-width="1"/>
  <text x="104" y="140" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">skill</text>
  <text x="104" y="155" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">embedded SKILL.md</text>

  <!-- payload box -->
  <rect x="36" y="180" width="136" height="40" rx="4"
        fill="rgba(107,114,128,.07)" stroke="#9ca3af" stroke-width="1"/>
  <text x="104" y="198" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">payload</text>
  <text x="104" y="213" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">hooks · agents · bin</text>

  <!-- brace / single-source label -->
  <text x="104" y="250" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">one source</text>

  <!-- ─── ARROW: components → gnx build ─── -->
  <line x1="189" y1="160" x2="248" y2="160"
        stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ─── COLUMN 2: gnx build (accent — the deterministic transform) ─── -->
  <rect x="249" y="130" width="112" height="58" rx="6"
        fill="rgba(224,93,68,.06)" stroke="#e05d44" stroke-width="1.5"/>
  <text x="305" y="155" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e05d44">gnx build</text>
  <text x="305" y="172" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#e05d44" opacity=".8">deterministic</text>

  <!-- ─── FORK ARROWS: gnx build → two outputs ─── -->
  <!-- upper fork line: right then up-right -->
  <polyline points="362,159 420,159 420,116"
            fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- lower fork line: right then down-right -->
  <polyline points="362,161 420,161 420,218"
            fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- fork labels -->
  <text x="376" y="148" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="10" fill="#9ca3af">plugin dir</text>
  <text x="376" y="192" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="10" fill="#9ca3af">marketplace</text>

  <!-- ─── COLUMN 3: generated outputs (committed) ─── -->
  <!-- grouping box -->
  <rect x="420" y="56" width="220" height="236" rx="5"
        fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="530" y="46" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" letter-spacing=".04em">
    generated · committed
  </text>

  <!-- plugin dir box -->
  <rect x="434" y="68" width="192" height="102" rx="4"
        fill="rgba(107,114,128,.05)" stroke="#9ca3af" stroke-width="1"/>
  <text x="530" y="88" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">targets/claude-code/&lt;plugin&gt;/</text>

  <!-- plugin.json sub-item -->
  <rect x="450" y="100" width="76" height="28" rx="3"
        fill="none" stroke="#c4c9d0" stroke-width="1"/>
  <text x="488" y="118" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">plugin.json</text>

  <!-- skills/ sub-item -->
  <rect x="536" y="100" width="52" height="28" rx="3"
        fill="none" stroke="#c4c9d0" stroke-width="1"/>
  <text x="562" y="118" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">skills/</text>

  <!-- agents/ + hooks/ sub-items -->
  <rect x="450" y="136" width="60" height="24" rx="3"
        fill="none" stroke="#c4c9d0" stroke-width="1"/>
  <text x="480" y="152" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">agents/</text>
  <rect x="522" y="136" width="52" height="24" rx="3"
        fill="none" stroke="#c4c9d0" stroke-width="1"/>
  <text x="548" y="152" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">hooks/</text>

  <!-- marketplace.json box -->
  <rect x="434" y="192" width="192" height="50" rx="4"
        fill="rgba(107,114,128,.05)" stroke="#9ca3af" stroke-width="1"/>
  <text x="530" y="211" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">.claude-plugin/</text>
  <text x="530" y="229" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">marketplace.json</text>

  <!-- "one source → both manifests" annotation -->
  <text x="530" y="310" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af" font-style="italic">
    one source → both manifests generated (no drift)
  </text>

  <!-- ─── ARROW: committed outputs → install ─── -->
  <line x1="641" y1="168" x2="700" y2="168"
        stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="671" y="158" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="10" fill="#9ca3af">/plugin install</text>

  <!-- ─── COLUMN 4: install cache ─── -->
  <rect x="701" y="118" width="142" height="100" rx="5"
        fill="rgba(107,114,128,.05)" stroke="#9ca3af" stroke-width="1"/>
  <text x="772" y="140" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">~/.claude/plugins/</text>
  <text x="772" y="156" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">cache/&lt;mkt&gt;/&lt;plugin&gt;/</text>
  <text x="772" y="172" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">&lt;version&gt;/</text>
  <text x="772" y="192" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af" font-style="italic">self-contained copy</text>

  <!-- "no install-time build" annotation -->
  <text x="772" y="238" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af" font-style="italic">no install-time build</text>
  <text x="772" y="252" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af" font-style="italic">→ projection must be</text>
  <text x="772" y="266" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af" font-style="italic">committed</text>

</svg>

# gnx component manifest — radix. slick's 5 fields + relations + maturity.
# radix is NOT a Skill (the two sibling components, intent-hardening and rational-inquiry,
# are provides-only Skills). radix is a comprehension PROCESSOR: it consumes Artifacts and
# produces grounded, judged Frames on the Construct — it has real produces/consumes topology.
#
# NOTE: `kind` and whether produces/consumes are first-class manifest fields are GATED on
# OD-10 (L2 processor vs L3 component; `meta/decisions.md`, deferred register §8.3). This
# manifest encodes the design-intent shape; the kind literal and topology fields await OD-10.
type_url: gnx.dev.v1.radix
kind: Processor            # PROVISIONAL — OD-10 OPEN (Processor if L2; Component if L3)
source: ./SKILL.md         # entry/overview; framework text becomes canonical at text-conformance
provides:
  - radix.comprehension            # Artifact -> grounded, judged Frames on the Construct
  - radix.base-relations-models    # the one comprehension ontology (Surface<-Base/Relations/Models)
  - radix.grounding-gate           # Gate 1: grounding-chain, part-existence, write-time
  - radix.judgement-gate           # Gate 2: judgement, configuration-integrity, assay-time
  - radix.construct                # the typed-frame blackboard interface
  - radix.temporal-axis            # snapshot|history over B/R/M — LEANING/UNBUILT as an axis
requires: []                       # deterministic critical path bundles no external LLM API
relations:
  uses:
    - gnx.dev.v1.rational-inquiry   # judgement gate composes the fallacy/defeat discipline (soft dep)
  # produces/consumes topology (Artifact in, Frame-on-Construct out) is the L2-processor
  # shape; whether it is expressed here is OD-10's call. Downstream consumers (ilm ranking,
  # REP-021 decay/eviction) are NOT declared here — boundary discipline (D-JUDGE): radix must
  # not name downstream machinery. The interface must not preclude them; it stays silent on them.
description: Comprehension processor — consumes Artifacts, produces grounded and judged Frames on the Construct. # D23 overlay field
maturity: design    # HONEST: text modality is BUILT elsewhere (radix-text v2, 81 tests) as a
                    # separate prototype; code (391 frames) and vis (tracer) likewise. The
                    # CONSOLIDATED gnx/components/radix build is DESIGN-stage. NOT `shipped`.
                    # Compare intent-hardening / rational-inquiry = shipped.

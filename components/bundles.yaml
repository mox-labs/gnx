# Plugin projections — the Target-side bundling declaration.
#
# Components are per-unit (D21/D23: one aspect-named unit per directory). Claude Code
# plugins are coarser: a user installs "guild-arch", not thirteen separate council
# agents. This file is where that regrouping is *declared* rather than hardcoded in the
# projector, so adding a plugin is a data change and re-cutting a bundle is a one-line
# edit. plugins/ is generated output — committed, but never authored by hand.
#
# Components own nothing about their projection. A component can appear in more than one
# bundle; nothing here writes back into components/.
#
# Capabilities (matrix, ix, recon, dao, gnx) are Python packages, not Claude Code shapes:
# they are reached over a transport, and the protocol-location question is unresolved
# (MF7). So a Capability's *runnable* does not project. Its *semantic surface* can, when it
# has one — recon ships a real SKILL.md inside its package, projected below from its
# in-package path.
#
# --- 2026-08-19: the catalog was cut back to what has been evaluated. ---
#
# 69 components (33 skills, 36 agents) moved to `incubator/`, joining radix. They are intact
# and versioned; they are not in the catalog and are not projected. The reason is honesty
# rather than tidiness: a live routing eval measured `dao` failing to activate on trigger
# phrases quoted in its own description, and 49 of 76 descriptions exceeded the
# catalog-scale target. Shipping 76 on that evidence would assert a quality nobody checked.
# Graduating one back is a directory move plus an entry here.

marketplace:
  name: gnx
  owner:
    name: Mox Labs
    email: mox.rnd@gmail.com
  metadata:
    description: >-
      A catalog of composable components. Your agent composes capability from the
      catalog, and you govern it.

# Defaults applied to every plugin that does not override them. The cix inheritance was
# hardcoded MIT + Mox Labs in the projector, which would have mislabelled anything
# carrying a different license; here it is a default with an escape hatch.
defaults:
  license: MIT
  author:
    name: Mox Labs
    email: mox.rnd@gmail.com

plugins:
  # The two gnx-native skills. Single-skill plugins by design: each is one discipline and is
  # installed on its own. Both carry a manifest — they are the pilot for the identity grammar.
  - name: intent-hardening
    version: 0.1.0
    category: foundation
    description: >-
      Intent is not extracted from an utterance — it is hardened through structured
      discourse. Turn a fuzzy ask into something the catalog can act on.
    keywords: [intent, discourse, requirements, gnx]
    skills: [intent-hardening]

  - name: rational-inquiry
    version: 0.1.0
    category: foundation
    description: >-
      Inference-validity discipline — the fallacy and defeat gate. Test whether a
      "therefore" actually holds.
    keywords: [inference, logic, fallacy, validity, gnx]
    skills: [rational-inquiry]

  # A Capability's semantic surface. The recon *package* stays a Python runnable under
  # components/capabilities/recon; only its authored skill projects, from the path where it
  # lives inside the package.
  - name: recon
    version: 0.8.0
    category: research
    description: >-
      Heterogeneous sources in, structured data out. Fetch from APIs, CLIs, and web
      pages; reshape to uniform JSONL queryable with SQL.
    keywords: [collection, scraping, apis, duckdb, jsonl]
    external_skills:
      - name: recon
        path: components/capabilities/recon/src/recon/assets/skills/recon

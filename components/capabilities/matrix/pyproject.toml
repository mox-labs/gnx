[project]
name = "matrix"
version = "0.6.0"
description = "Components wired by kind, a durable record of every run, and agents composed from config"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# A copy of the repository's LICENSE: a package built from this directory alone carries it.
license-files = ["LICENSE"]
authors = [
    { name = "yzavyas", email = "yza.vyas@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    # The API only: spans and metrics cost nothing until an SDK is installed (the otel extra).
    # >=1.23: the first release with a synchronous gauge, which a `gauge` measure records to.
    "opentelemetry-api>=1.23",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13",
    "rich-click>=1.8",
]

[project.urls]
Repository = "https://github.com/mox-labs/gnx"
Documentation = "https://mox-labs.github.io/gnx"
Issues = "https://github.com/mox-labs/gnx/issues"
Changelog = "https://github.com/mox-labs/gnx/blob/main/components/capabilities/matrix/CHANGELOG.md"

[project.scripts]
matrix = "matrix.adapters._in.cli:run"

# Every extension, matrix's own included, registers through this one group: each entry point
# is a callable register(registry) -> None, loaded by matrix.load_extensions().
[project.entry-points."matrix.extensions"]
matrix = "matrix.composition.builtins:register"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "opentelemetry-sdk>=1.23"]
# >=0.1.51: the first release that strips CLAUDECODE from the CLI's environment itself
# (bisected against PyPI wheels), which is what lets the runtime leave os.environ alone.
claude = ["claude-agent-sdk>=0.1.51"]
# The `model` agent runtime: any model family hardline has a registry row for. Bounded to the
# minor matrix is built against: before 1.0 a hardline minor may break.
models = ["hardline>=0.1,<0.2"]
# The SDK and both OTLP exporters (http/protobuf, the spec's default, and grpc), which the
# standard OTEL_* variables select.
otel = [
    "opentelemetry-sdk>=1.23",
    "opentelemetry-exporter-otlp>=1.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/matrix/**/*.py",
    "src/matrix/py.typed",
]

# The house lint set: B (bugbear), SIM, TC on top of the base selection.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# The OTLP exporters ship only with the `otel` extra, and telemetry.py imports them lazily
# inside configure_telemetry() so matrix runs without them. Scoped to those modules.
[[tool.mypy.overrides]]
module = ["opentelemetry.exporter.otlp.*"]
ignore_missing_imports = true

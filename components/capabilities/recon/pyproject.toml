[project]
name = "recon"
version = "0.15.0"
description = "Config-driven collection: fetch or run what a mission names, normalize the answers to JSONL, query them with SQL"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# A copy of the repository's LICENSE: a package built from this directory alone carries it.
license-files = ["LICENSE"]
authors = [
    { name = "yzavyas", email = "yza.vyas@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    # Pydantic's maintained continuation of httpx; bounded to the major tested.
    "httpx2>=2.10,<3",
    "rich>=13.0",
    "rich-click>=1.8",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "xmltodict>=0.13",
    # Below 2.0: the skill and the tests state DuckDB 1.x behaviour, and 2.0 changes some of
    # it (it unnests beside an aggregate, which the skill says DuckDB does not).
    "duckdb>=1.0,<2",
    # DuckDB imports pytz to return a TIMESTAMP WITH TIME ZONE, and does not declare it.
    "pytz>=2024.1",
    "tenacity>=9.0",
    "markitdown[all]>=0.1.0",
    # The library writes through the API alone, a no-op until an application installs an
    # SDK. The `recon` command is such an application: it carries the SDK and the OTLP
    # exporter over http/protobuf, the one protocol it exports over (no gRPC), so the OTEL_*
    # variables are enough to export. They are imported only when a variable asks for one.
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # The `mcp` collector's client: the one pydantic-ai's MCPToolset wraps, on the MCP SDK v2
    # and httpx2. Imported only by that collector's adapter, and only when a survey uses it.
    "fastmcp-slim[client]>=4.1.3,<5",
    # The `mcp` collector checks a run's arguments against its tool's input schema, and
    # resolves the schema's `$ref`s with a registry that retrieves nothing.
    "jsonschema>=4.20",
    "referencing>=0.28",
]

[project.urls]
Repository = "https://github.com/mox-labs/gnx"
Documentation = "https://mox-labs.github.io/gnx"
Issues = "https://github.com/mox-labs/gnx/issues"
Changelog = "https://github.com/mox-labs/gnx/blob/main/components/capabilities/recon/CHANGELOG.md"

[project.scripts]
recon = "recon.adapters._in.cli:main"

# Collector types and transforms are extensions. recon's built-ins register through the
# same groups a third-party package uses; the entry-point name is the config's `type:`
# (collectors) or the `$name` in a normalize spec (transforms).
[project.entry-points."recon.collectors"]
api = "recon.adapters._out.api_collector:collector_type"
cli = "recon.adapters._out.cli_collector:collector_type"
web = "recon.adapters._out.web_collector:collector_type"
capture = "recon.adapters._out.capture_collector:collector_type"
mcp = "recon.adapters._out.mcp_collector:collector_type"
tail = "recon.adapters._out.tail_collector:collector_type"
sse = "recon.adapters._out.sse_collector:collector_type"

[project.entry-points."recon.transforms"]
html2text = "recon.domain.normalize:html2text"
inverted_index = "recon.domain.normalize:inverted_index"
join = "recon.domain.normalize:join"
first = "recon.domain.normalize:first"
markitdown = "recon.adapters._out.markitdown_converter:markitdown_path"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/recon/**/*.py",
    "src/recon/configs/*.yaml",
    "src/recon/**/*.md",
    "src/recon/py.typed",
]

# The x.uma/puma house lint set: B (bugbear), SIM, TC on top of E, F, I, N, W, UP.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# xmltodict and jsonschema ship no py.typed marker, so strict mode cannot analyze them.
# Scoped to this module only; everything else stays strict.
[[tool.mypy.overrides]]
module = ["xmltodict", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

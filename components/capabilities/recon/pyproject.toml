[project]
name = "recon"
version = "0.9.0"
description = "Mechanical collection system — collect, normalize, query via parquet + DuckDB"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "yzavyas", email = "yza.vyas@gmail.com" }
]

dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "xmltodict>=0.13",
    "duckdb>=1.0",
    "glom>=23.0",
    "tenacity>=9.0",
    "markitdown[all]>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
recon = "recon.adapters._in.cli:main"

# Collector types and transforms are extensions. recon's built-ins register through the
# same groups a third-party package uses; the entry-point name is the config's `type:`
# (collectors) or the `$name` in a normalize spec (transforms).
[project.entry-points."recon.collectors"]
api = "recon.adapters._out.api_collector:collector_type"
cli = "recon.adapters._out.cli_collector:collector_type"
web = "recon.adapters._out.web_collector:collector_type"
capture = "recon.adapters._out.capture_collector:collector_type"

[project.entry-points."recon.transforms"]
html2text = "recon.application.transforms:html2text"
inverted_index = "recon.application.transforms:inverted_index"
join = "recon.application.transforms:join"
first = "recon.application.transforms:first"
markitdown = "recon.adapters._out.markitdown_converter:markitdown_path"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/recon/**/*.py",
    "src/recon/configs/*.yaml",
    "src/recon/**/*.md",
    "src/recon/py.typed",
]

# The x.uma/puma house lint set: B (bugbear), SIM, TC on top of E, F, I, N, W, UP.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# glom and xmltodict ship no py.typed marker, so strict mode cannot analyze them.
# Scoped to these modules only; everything else stays strict.
[[tool.mypy.overrides]]
module = ["glom", "xmltodict"]
ignore_missing_imports = true

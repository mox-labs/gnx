# Docs mining — fetch documentation pages, convert HTML to markdown.
#
# Demonstrates:
#   • an api collector reading its answer as a document (response_format: document:
#     HTML, PDF, DOCX, ... → markdown, through recon's document converter)
#   • several collectors sharing one source
#   • the fixed record of a document: {url, title, content, content_type}
#
# Each page is a separate collector entry. To crawl many pages, duplicate the
# collector block (or generate the config programmatically from a sitemap).
#
# Usage:
#   recon init python-docs --template docs-mine
#   # edit endpoints to target pages you care about
#   recon survey python-docs
#   recon query python-docs \
#     "SELECT title, length(content) FROM python_tutorial"

catalog:
  - name: python-docs
    type: api
    url: https://docs.python.org/3
    rate_limit: { rps: 1, burst: 2 }
    timeout: 30

collectors:
  - name: python-tutorial
    type: api
    source: python-docs
    response_format: document
    endpoint: /tutorial/introduction.html

  - name: python-datastructures
    type: api
    source: python-docs
    response_format: document
    endpoint: /tutorial/datastructures.html

  - name: python-classes
    type: api
    source: python-docs
    response_format: document
    endpoint: /tutorial/classes.html

  - name: python-modules
    type: api
    source: python-docs
    response_format: document
    endpoint: /tutorial/modules.html

# The capabilities workspace.
#
# This is a uv workspace root, NOT the repo root. gnx's repo root identity is
# `.claude-plugin/marketplace.json`, a Claude Code plugin marketplace. Capabilities are
# runnables that BACK components (components/INTAKE.md §"Tool binding"), so their
# Python-ness is scoped here and never leaks up to the marketplace root.
#
# `uv lock` and `uv run` work from this directory and from inside any member.

[tool.uv.workspace]
members = ["*"]
# pytest writes __pycache__ beside conftest.py here, and it is no member.
exclude = ["__pycache__"]

# uv 0.9+ REQUIRES an explicit source entry for a workspace-internal dependency.
# A member that declares a bare `matrix` dep fails to resolve without this, with
# "`matrix` is included as a workspace member, but is missing an entry in
# `tool.uv.sources`". A package installed from a git URL with a subdirectory resolves
# these too: uv clones the whole repository and finds this workspace root.
[tool.uv.sources]
matrix = { workspace = true }
ix = { workspace = true }
recon = { workspace = true }
gnx = { workspace = true }
dao = { workspace = true }
hardline = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.8",
    "types-PyYAML",  # gnx + harness parse YAML; strict mypy needs the stubs
    "opentelemetry-sdk>=1.20",  # matrix's telemetry tests install an SDK provider
    # The `claude` extra: matrix's SDK runtime is typechecked and tested here, and no other
    # member brings the SDK in.
    "matrix[claude]",
    "ix",
    "recon",
    "gnx",
    "dao",
    "hardline",
]

# The one pytest configuration. No member sets its own, so wherever pytest starts in the
# workspace this is the rootdir, and conftest.py beside it (no test reaches a live model)
# applies to every package's tests.
[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# Two copies of one server, compared on latency.
#
#   ix register examples/delay-server/identical.yaml
#   ix run examples/delay-server/identical.yaml
#
# The subject is server.py beside this file: it answers every request after a fixed delay.
# One trial is a few seconds of load from k6. The run takes about two minutes.
name: delay-identical
question: Is a second copy of the same server faster than the first?
genre: compare

subjects:
  baseline:
    kind: process
    command: [python3, server.py, --port, "18473", --delay-ms, "40"]
    url: "http://127.0.0.1:18473"
    ready: "http://127.0.0.1:18473/healthz"
  candidate:
    kind: process
    command: [python3, server.py, --port, "18473", --delay-ms, "40"]
    url: "http://127.0.0.1:18473"
    ready: "http://127.0.0.1:18473/healthz"

probes:
  - id: get
    kind: http-load
    target: "{url}/work"
    load_model: closed
    concurrency: 4
    duration: 3s
    warmup: 1s

primary: {metric: latency, statistic: p50}
comparison: superiority

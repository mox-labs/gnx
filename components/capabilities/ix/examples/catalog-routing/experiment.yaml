# An agent evaluation: does the right skill fire for a real ask, and stay quiet for a decoy?
#
#   ix validate examples/catalog-routing
#   ix plan examples/catalog-routing
#
# One subject and a threshold. The subject is a Claude Code session loaded with the plugins
# this repository ships, so it runs from a checkout of the repository, on the claude-sdk
# runtime: a run calls a model provider. The probes are the files in probes/ beside
# this one: the body is the prompt, the frontmatter the truth the activation sensor reads.
name: catalog-routing
question: Does the right skill fire for a real ask and stay quiet for a decoy?
genre: evaluate

subjects:
  catalog:
    kind: agent-session
    runtime: claude-sdk
    max_turns: 1                        # the skill call happens in the first turn; stop there
    setting_sources: []                 # none of this machine's settings or plugins
    permission_mode: bypassPermissions  # nobody is there to approve a tool call
    plugins: ["../../../../../plugins/*"]

primary: {metric: activated_correctly}
threshold: {op: ">=", value: 0.9}
# A pass rate's interval reaches above 0.9 only from 35 trials, every one passing: 12
# repeats of the 3 probes is 36. With the genre's 10 (30 trials) `ix plan` says the run
# cannot hold.
repeats: 12
metrics: [tokens_total]     # reported, not decided on

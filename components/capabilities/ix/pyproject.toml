[project]
name = "ix"
version = "0.5.0"
description = "Experiments on agents and services: one file with a genre, validated, planned, registered, run and reported"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# A copy of the repository's LICENSE: a package built from this directory alone carries it.
license-files = ["LICENSE"]
authors = [
    { name = "yzavyas", email = "yza.vyas@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    # This repository's matrix, not PyPI's project of that name: the workspace's
    # [tool.uv.sources] resolves it, from a checkout and from a git URL alike. Bounded to the
    # minor ix is built against: before 1.0 a matrix minor may break.
    "matrix>=0.6,<0.7",
    "httpx>=0.27",
    "opentelemetry-api>=1.20",
    # The SDK's tracer provider, which a run whose sensors read spans installs, with no
    # exporter, when none is installed (W11.2b). Imported only then.
    "opentelemetry-sdk>=1.20",
    "rich-click>=1.8",
    "rich>=13",
    "pydantic>=2.0",
    # The evaluator sensor wraps pydantic-evals' evaluators; imported only inside that adapter
    # (ix.adapters._out.evaluators), so it costs nothing until an experiment names one.
    "pydantic-evals>=2.59,<3",
]

[project.urls]
Repository = "https://github.com/mox-labs/gnx"
Documentation = "https://mox-labs.github.io/gnx"
Issues = "https://github.com/mox-labs/gnx/issues"
Changelog = "https://github.com/mox-labs/gnx/blob/main/components/capabilities/ix/CHANGELOG.md"

# Genres and kinds are data. A package registers a package of `*.yaml` files at the
# `ix.genre` or `ix.kind` entry point, which ix owns; ix registers its own the same way.
# An entry point is read for its name and never called.
[project.entry-points."ix.genre"]
ix = "ix.builtin.genres"

[project.entry-points."ix.kind"]
ix = "ix.builtin.kinds"

# ix's run path, its extension points and its adapters, registered as every matrix
# extension is; `matrix catalog` lists them.
[project.entry-points."matrix.extensions"]
ix = "ix.composition.extension:register"

# An agent session runs on one of matrix's runtimes; each brings what it needs.
[project.optional-dependencies]
claude = ["matrix[claude]"]   # the claude-sdk runtime: Claude Agent SDK sessions
models = ["matrix[models]"]   # the model runtime: one call through hardline (a judge's default)
otel = ["matrix[otel]"]       # export of ix's and matrix's spans from the OTEL_* variables
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ix = "ix.adapters._in.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ix"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/ix/**/*.py",
    "src/ix/**/*.md",
    "src/ix/**/*.yaml",
    "src/ix/py.typed",
]

# The house lint set: B (bugbear), SIM, TC on top of the base selection.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TC"]

# pydantic reads a model's annotations at runtime, so the types they name cannot move into
# a TYPE_CHECKING block. Record and Stored are the bases of every model ix has.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "ix.domain.schema.Record",
    "ix.domain.schema.Stored",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

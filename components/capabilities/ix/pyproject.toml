[project]
name = "ix"
version = "0.3.0"
description = "ix: experiments on agents and services. One file with a genre; validate, plan and register it"
# readme = "README.md"  # TODO: create when ready
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "yzavyas", email = "yza.vyas@gmail.com" }
]

dependencies = [
    "rich-click>=1.8",
    "rich>=13",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
]

# Genres and kinds are data. A package registers a package of `*.yaml` files at the
# `ix.genre` or `ix.kind` entry point, which ix owns; ix registers its own the same way.
# An entry point is read for its name and never called.
[project.entry-points."ix.genre"]
ix = "ix.builtin.genres"

[project.entry-points."ix.kind"]
ix = "ix.builtin.kinds"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ix = "ix.adapters._in.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ix"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/ix/**/*.py",
    "src/ix/**/*.md",
    "src/ix/**/*.yaml",
    "src/ix/py.typed",
]

# The house lint set: B (bugbear), SIM, TC on top of the base selection.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TC"]

# pydantic reads a model's annotations at runtime, so the types they name cannot move into
# a TYPE_CHECKING block. Record and Stored are the bases of every model ix has.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "ix.domain.schema.Record",
    "ix.domain.schema.Stored",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[project]
name = "ix"
version = "0.2.0"
description = "ix: experiments on agents. Probes, subjects, sensors and statistics, driven by config"
# readme = "README.md"  # TODO: create when ready
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "yzavyas", email = "yza.vyas@gmail.com" }
]

dependencies = [
    "rich-click>=1.8",
    "rich>=13",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "matrix",
    "hardline",
    "claude-agent-sdk>=0.1.51",  # see matrix's `claude` extra
]

# ix declares its extension points (sensor, engine) and registers its built-ins through
# matrix's one discovery group, exactly as a third-party sensor or engine does.
[project.entry-points."matrix.extensions"]
ix = "ix.composition.builtins:register"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
deepeval = ["deepeval>=2.0"]
# The Inspect AI engine: runs an ix experiment as an Inspect task (epochs, logs, log viewer).
inspect = ["inspect-ai>=0.3.100"]

[project.scripts]
ix = "ix.adapters._in.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ix"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/ix/**/*.py",
    "src/ix/**/*.md",
    "src/ix/py.typed",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# deepeval auto-registers a pytest plugin that opens a telemetry capture per session.
addopts = "-p no:deepeval"

# The house lint set: B (bugbear), SIM, TC on top of the base selection.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# deepeval is an optional extra and ships no stubs (no py.typed). Scoped to that module
# so the missing-stub allowance can never mask an error in ix's own code — the alternative,
# a bare `ignore_errors`, would have hidden the two Any-returns fixed in sensors_deepeval.
[[tool.mypy.overrides]]
module = ["deepeval.*"]
ignore_missing_imports = true

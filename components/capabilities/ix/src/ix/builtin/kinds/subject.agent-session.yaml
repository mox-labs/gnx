schema: ix.v1.kind
name: ix.v1.subject.agent-session
summary: An agent on a matrix agent runtime; each trial is a fresh session in a working directory of its own.
overlap: allowed
options:
  runtime:
    type: string
    required: true
    description: "the matrix agent runtime that runs the agent: one of the choices, or any agent runtime installed. There is no default, so a model provider is never called implicitly"
    choices:
      claude-sdk: the Claude Agent SDK, with tools; calls a model provider
      pydantic-ai: pydantic-ai's agent loop, every model call on the model runtime its runtime_options.model_runtime names (one of matrix.model_runtimes); calls a model provider
      mock: canned replies; calls no model
  definition: {type: path, description: "a Claude Code agent file: its body is the system prompt; its tools, model and maxTurns apply unless set here"}
  model: {type: string, default_from: [runtime], description: "the model the agent uses; left out, the definition's, or else the runtime's own"}
  system_prompt: {type: string, text: true, description: the system prompt}
  tools: {type: list, left_out: every tool the runtime offers, description: "the tools the agent may call; left out, every tool the runtime offers; [] is none at all"}
  max_turns: {type: integer, default_from: [runtime], description: "turns after which the session is stopped; left out, the definition's, or else the runtime's own"}
  plugins: {type: paths, description: "plugin folders (relative to the experiment; a * matches several) or {type: local, path}, handed to the runtime as its plugins with every path absolute; a runtime whose config takes none refuses them"}
  skills: {type: paths, description: "skill folders (each holding SKILL.md), copied to where the agent runtime says a session finds its skills (claude-sdk: the session's .claude/skills, read as its project settings)"}
  fixtures: {type: paths, description: "files and folders, relative to the experiment, copied into each trial's working directory before the session starts"}
  setup: {type: command, description: "a command run in the working directory after the fixtures are copied, before the session: [python3, seed.py]; the program, and each file an argument names relative to the experiment, are digested as what was tested"}
  setup_timeout: {type: duration, default: 300s, description: "how long the setup command may take; one that runs past it fails the trial as the harness's (setup_failed)"}
  loop:
    type: mapping
    text: true
    binds: [prompt, response, failures, until]
    description: "more rounds after the first, each a fresh session in the same working directory; a prompt is the next round's task, with {prompt}, {response}, {until} and, for test-feedback, {failures} filled in each round"
    fields:
      strategy: {type: string, required: true, allowed: [self-review, test-feedback], description: "self-review: the agent reviews its answer until it carries until; test-feedback: the probe's feedback tests run on the answer's code, and the agent is shown what failed until nothing does"}
      rounds: {type: integer, default: 3, description: "every round, the first included: 1 is the first answer alone, so a sweep over the rounds can start from no loop at all"}
      until: {type: string, default: SOLUTION_VERIFIED, description: "for self-review: the text an answer that should end the loop carries"}
      test_timeout: {type: duration, default: 30s, description: "for test-feedback: how long the tests run on one round's answer may take"}
      prompt:
        type: string
        description: "the next round's task"
        default_by:
          option: strategy
          values:
            self-review: "Here is a task and your previous answer to it. Review the answer. If it is correct and complete, repeat it and end with the line {until}. Otherwise give the corrected answer in full.\n\nTask:\n{prompt}\n\nYour previous answer:\n{response}"
            test-feedback: "Here is a task and your previous answer to it. Your answer's code failed these tests:\n{failures}\n\nGive the corrected answer in full.\n\nTask:\n{prompt}\n\nYour previous answer:\n{response}"
  runtime_options: {type: mapping, description: "the runtime's own config, passed through as written and checked by the runtime (claude-sdk: permission_mode, setting_sources, fallback_model, max_budget_usd, agents); `matrix describe matrix.v1.agent-runtime.<name>` lists a runtime's"}
offers: [respondent, workdir]

schema: ix.v1.kind
name: ix.v1.sensor.timing
summary: Latency and throughput, read from what a load probe recorded.
needs: [load]
metrics:
  - {name: latency, unit: ms, direction: lower, shape: histogram, description: time from request sent to response complete}
  - {name: ttfb, unit: ms, direction: lower, shape: histogram, description: time from request sent to first byte}
  - {name: throughput, unit: req/s, direction: higher, shape: scalar, description: completed requests per second}
  - {name: error_rate, unit: ratio, direction: lower, shape: scalar, description: share of requests that failed}

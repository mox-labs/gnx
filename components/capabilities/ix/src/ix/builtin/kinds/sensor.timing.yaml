schema: ix.v1.kind
name: ix.v1.sensor.timing
summary: Latency and throughput, read from what a load probe recorded.
overlap: forbidden
needs: [load]
metrics:
  - {name: latency, unit: ms, direction: lower, shape: histogram, contended: true, description: time from request sent to response complete}
  - {name: ttfb, unit: ms, direction: lower, shape: histogram, contended: true, description: time from request sent to first byte}
  - {name: throughput, unit: req/s, direction: higher, shape: scalar, contended: true, description: successfully answered requests per second}
  - {name: error_rate, unit: ratio, direction: lower, shape: count, contended: true, description: "requests that failed (refused, broken, timed out or never answered) and arrivals dropped, out of requests sent and arrivals dropped"}

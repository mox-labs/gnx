schema: ix.v1.kind
name: ix.v1.probe.http-load
summary: HTTP load against a URL for a fixed time, driven by a load tool.
options:
  target: {type: string, required: true, description: the URL to load}
  load_model: {type: string, required: true, allowed: [open, closed], description: "open holds an arrival rate; closed holds a number of clients. It changes what latency means"}
  duration: {type: duration, required: true, description: how long the measured load lasts}
  rate: {type: rate, required_when: {load_model: open}, description: "arrivals for an open model, such as 20/s or 600/m"}
  concurrency: {type: integer, description: "clients for a closed model; for an open model, how many the load tool may use"}
  warmup: {type: duration, description: load applied before measuring starts}
  method: {type: string, description: the HTTP method}
  headers: {type: mapping, description: headers sent with every request}
  verify_body: {type: string, allowed: [sha256], description: every response body must have the digest of the first one fetched}
effects: [process, network]
needs: [url]
offers: [load]
duration: [warmup, duration]

# compare: is a variant better than the control, or no worse?
schema: ix.v1.genre
name: ix.v1.genre.compare
question: Is the variant better than the control, or no worse?
roles:
  - {name: control, min: 1, max: 1}
  - {name: variant, min: 1}
factors: allowed
must_set: [primary, comparison]
comparisons:
  superiority: "{variant} is better than {control} on {metric}"
  non-inferiority: "{variant} is no worse than {control} by more than {margin} on {metric}"
  equivalence: "{variant} is within {margin} of {control} on {metric}"
design:
  repeats: {default: 5, min: 3}
  order: interleaved
  calibration: aa
  estimator: mean
  note: "provisional: pending the experimentation canon"
analysis:
  id: ix.v1.analysis.compare
  params: {pairing: control, correction: holm}
verdict_form: three-way
report: [question, design, estimates, noise_floor, failures, warrant, raw]
guidance: |
  Use compare when there are two or more ways of doing something and you must choose.
  One subject is the control: the first, unless `control: <name>` says otherwise. Every
  other subject is a variant, and each variant is compared with the control.
  Decide the comparison and the margin before you run. `superiority` claims the variant
  is better. `non-inferiority` claims it is no worse than the control by more than
  `margin`; `equivalence` claims it is within `margin` either way. Those two need a
  margin: the largest loss you would still accept.
  Add `guardrails:` for metrics that must also hold, each within its own `margin` of the
  control or against an absolute `threshold`.
  Change one thing between a variant and the control; ix warns when more than one differs.
  What would falsify it: the interval of the difference lies on the wrong side of the
  margin. A difference inside the noise floor is inconclusive, never a win.

# regress: may this change ship against the baseline? compare, narrowed.
schema: ix.v1.genre
name: ix.v1.genre.regress
extends: ix.v1.genre.compare
question: May this change ship against the baseline?
roles:
  - {name: control, min: 1, max: 1}
  - {name: variant, min: 1, max: 1}
must_set: [primary, comparison, margin]
comparisons:
  non-inferiority: "{variant} is at most {margin} worse than {control} on {metric}"
default_comparison: non-inferiority
# A gate is taken up mechanically, so its trials do not overlap until the live validation
# slice shows trials in flight measure what one at a time does (ix design record §27).
design:
  overlap: forbidden
report: [question, design, gate, estimates, calibration, baseline, failures, warrant, raw]
guidance: |
  Use regress to gate a change: the candidate must be no worse than the baseline.
  regress is compare narrowed to one variant, with the comparison fixed to
  non-inferiority: a candidate that does not differ from the baseline holds once the
  interval stays above `-margin`. It need not be better.
  The control is the baseline build and the one variant is the candidate. Rebuild the
  baseline and run it in the same experiment, so the two are measured under the same
  conditions.
  regress answers "may the candidate ship: is it no worse than the baseline?", not "is
  the candidate slower?": for that, use compare with superiority, which asks for a
  difference.
  Decide the margin before you run: the largest regression you would still ship. It is
  the person's decision, never ix's, and the plan says where it came from. The
  comparison is not yours to change here.
  Register the experiment before any run (`ix register`), so the margin cannot move
  once the numbers are in. A run of an experiment that changed since its registration
  gives no gate result until the registration is amended with a reason.
  Its trials run one at a time (`overlap: forbidden`): `trials_in_flight` above 1 is
  refused here, whatever the kinds allow.  What would falsify it: the interval of the difference lies wholly beyond the margin on
  the worse side. An interval that crosses the margin is inconclusive, and inconclusive
  does not pass a gate.

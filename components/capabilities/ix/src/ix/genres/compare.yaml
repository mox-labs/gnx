# compare: is a variant better than, or no worse than, the control?
schema: ix.v1.genre
name: ix.v1.genre.compare
question: Is the variant better than the control, or no worse?
hypothesis_form: "{variant} is {rule} to {control} by {margin} on {metric}"
subjects:
  - {name: control, min: 1, max: 1}
  - {name: variant, min: 1}
factors: allowed
requires: [primary, rule]
rules: [superiority, non-inferiority, equivalence]
defaults:
  repeats: {value: 5, note: "provisional: pending the experimentation canon"}
  min_repeats: {value: 3, note: "provisional: pending the experimentation canon; fewer than three repeats cannot separate a difference from noise"}
  interleave: {value: true, note: "provisional: pending the experimentation canon; subjects alternate so drift is not mistaken for a difference"}
  aa: {value: true, note: "provisional: pending the experimentation canon; the control runs against itself to measure the noise floor"}
analysis:
  id: ix.v1.analysis.compare
  params: {pairing: control, correction: holm}
verdict: three-way
report: [question, design, estimates, noise_floor, faults, warrant, raw]
skill: |
  Use compare when there are two or more ways of doing something and you must choose.
  One subject is the control: the first, unless `control: <name>` says otherwise. Every
  other subject is a variant, and each variant is compared with the control.
  Decide the rule and the margin before you run. `rule: superiority` claims the variant is
  better. `rule: non-inferiority` claims it is no worse than the control by more than
  `margin`; `rule: equivalence` claims it is within `margin` either way. Both need a margin:
  the largest loss you would still accept.
  Name one primary metric, declared under `metrics:` with its direction, and not judged by
  a model. Add `guards:` for metrics that must also not get worse, each with its own margin.
  Change one thing between a variant and the control; ix warns when more than one differs.
  What would falsify it: the interval of the difference lies on the wrong side of the
  margin. A difference inside the noise floor is inconclusive, never a win.

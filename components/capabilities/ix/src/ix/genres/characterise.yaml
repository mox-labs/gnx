# characterise: how does one subject behave across a range?
schema: ix.v1.genre
name: ix.v1.genre.characterise
question: How does this subject behave across the range, and where does it bend?
hypothesis_form: "{subject} is measured on {metric} across {factors}"
subjects:
  - {name: subject, min: 1, max: 1}
factors: required
requires: []
rules: []
defaults:
  repeats: {value: 3, note: "provisional: pending the experimentation canon"}
  min_repeats: {value: 2, note: "provisional: pending the experimentation canon; one repeat per cell gives a point and no interval"}
  interleave: {value: true, note: "provisional: pending the experimentation canon; cells alternate so drift is not mistaken for a trend"}
  aa: {value: false, note: "provisional: pending the experimentation canon; there is no verdict to calibrate"}
analysis: {id: ix.v1.analysis.characterise}
verdict: none
report: [question, design, estimates, faults, raw]
skill: |
  Use characterise when you want the curve, not a decision: how a subject behaves as one
  or more factors change.
  Declare the factors and their levels under `factors:`; every combination is a cell and
  every cell is measured. Keep the grid as small as the question allows: trials multiply.
  There is no verdict, so there is no bar, margin or rule to state. A judged metric may be
  reported here.
  Report estimates with their intervals per cell. To turn a point on the curve into a
  decision, write an evaluate or a compare for that point.

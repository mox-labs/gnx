# evaluate: does one subject meet a bar?
schema: ix.v1.genre
name: ix.v1.genre.evaluate
question: Does this subject meet the bar?
hypothesis_form: "{subject} meets {bar} on {metric}"
subjects:
  - {name: subject, min: 1, max: 1}
factors: allowed
requires: [primary, bar]
rules: []
defaults:
  repeats: {value: 3, note: "provisional: pending the experimentation canon"}
  min_repeats: {value: 1, note: "provisional: pending the experimentation canon; one repeat gives an estimate and no noise floor"}
  interleave: {value: true, note: "provisional: pending the experimentation canon"}
  aa: {value: false, note: "provisional: pending the experimentation canon; with one subject there is nothing to calibrate against"}
analysis: {id: ix.v1.analysis.evaluate}
verdict: three-way
report: [question, design, estimates, faults, warrant, raw]
skill: |
  Use evaluate when one thing must meet a bar before it is relied on.
  Decide the bar before you run: the value the primary metric must reach, and the
  comparison (`bar: {op: ">=", value: 0.9}`). Name one primary metric and declare it
  under `metrics:`; it must not be judged by a model.
  Give exactly one subject. To ask which of two subjects is better, use compare.
  What would falsify it: the interval of the primary statistic lies on the wrong side of
  the bar. An interval that straddles the bar is inconclusive, and more repeats or more
  probes are the remedy, not a looser bar.

[project]
name = "matrix-hardline"
version = "0.1.0"
description = "hardline as a matrix model runtime: the one adapter between the two, registered as a matrix extension"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# A copy of the repository's LICENSE: a package built from this directory alone carries it.
license-files = ["LICENSE"]
authors = [
    { name = "yzavyas", email = "yza.vyas@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

# The two packages it bridges, each bounded to the minor it is built against: before 1.0 a
# minor of either may break the port or the reply this adapter maps.
dependencies = [
    "matrix>=0.10,<0.11",
    "hardline>=0.3.1,<0.4",
    "pydantic>=2.14.3",
]

[project.urls]
Repository = "https://github.com/mox-labs/gnx"
Documentation = "https://mox-labs.github.io/gnx"
Issues = "https://github.com/mox-labs/gnx/issues"
Changelog = "https://github.com/mox-labs/gnx/blob/main/components/capabilities/matrix-hardline/CHANGELOG.md"

# Registered as every matrix extension is: one line per point it registers at, so a session
# that reads neither loads none of it.
[project.entry-points."matrix.extensions"]
model-runtime = "matrix_hardline.runtime:register"
payload-type = "matrix_hardline.runtime:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_hardline"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/matrix_hardline/**/*.py",
    "src/matrix_hardline/py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

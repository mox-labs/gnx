[project]
name = "gnx"
version = "0.1.0"
description = "The gnx catalog CLI: list the components and project them into Claude Code plugins"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# A copy of the repository's LICENSE: a package built from this directory alone carries it.
license-files = ["LICENSE"]
authors = [
    { name = "yzavyas", email = "yza.vyas@gmail.com" }
]

dependencies = [
    "click>=8.5.1",
    "rich>=13",
    "pyyaml>=6",
]

[project.scripts]
gnx = "gnx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnx"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build]
include = [
    "src/gnx/**/*.py",
    "src/gnx/py.typed",
]

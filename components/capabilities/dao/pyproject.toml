[project]
name = "dao"
version = "0.1.0"
description = "Stand up and audit a Directed Agentic Organization for a project — the eleven-component dao spec, made checkable."
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "yzavyas", email = "yza.vyas@gmail.com" }
]

dependencies = [
    "click>=8.1",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dao = "dao.adapters._in.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dao"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/dao/**/*.py",
    "src/dao/**/*.md",
    "src/dao/py.typed",
]

# The x.uma/puma house gate: B (bugbear), SIM and TCH on top of the cix set.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

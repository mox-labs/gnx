[project]
name = "dao"
version = "0.2.0"
description = "Check a project's directed agent organization (constitution, policies, principles, positions, participants) and make it a book a person can explore"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# A copy of the repository's LICENSE: a package built from this directory alone carries it.
license-files = ["LICENSE"]
authors = [
    { name = "yzavyas", email = "yza.vyas@gmail.com" }
]

dependencies = [
    "click>=8.1",
    "rich>=13",
    "pydantic>=2.0",
]

[project.scripts]
dao = "dao.adapters._in.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dao"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/dao/**/*.py",
    "src/dao/**/*.md",
    "src/dao/**/*.html",
    "src/dao/**/*.js",
    "src/dao/py.typed",
]

# The x.uma/puma house gate: B (bugbear) and SIM on top of E, F, I, N, W, UP.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
